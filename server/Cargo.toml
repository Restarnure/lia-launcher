[package]
name = "lia-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
futures = "0.3.34"
png = "0.18.1"
rand = "0.10.3"
rsa = "0.9.10"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "0.10.6", features = ["oid"] }
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }
zip = "9.1.2"
