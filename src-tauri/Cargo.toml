[package]
name = "lia-launcher"
version = "1.1.2"
description = "ЛІЯ — лаунчер Minecraft"
edition = "2021"
publish = false

[lib]
name = "lia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
dirs = "7.0.0"
futures = "0.3.34"
hex = "0.4.3"
md-5 = "0.11.0"
png = "0.18"
rand = "0.10.3"
regex-lite = "0.1.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "gzip", "http2", "charset", "multipart", "query", "form", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sysinfo = "0.39.6"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.5.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
trash = "5.2.9"
url = "2.5.8"
zip = "9.0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Globalization"] }
