# Інсталятор ЛІЇ, зібраний з коду репозиторію на серверах GitHub. SignPath підписує лише такі збірки.
# Запуск: Actions → «Збірка» → Run workflow. Підписаний інсталятор публікує
# `node scripts/release.mjs <версія> <нотатки> --signed <exe> --publish` (ключ оновлень лишається на ПК).
# Підпис увімкнеться, коли в репозиторії з'являться секрет SIGNPATH_API_TOKEN і змінні
# SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG.
name: Збірка

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Без підпису оновлень: .sig рахується вже з підписаного інсталятора.
      - run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash
      - id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          output-artifact-directory: signed
      - if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: installer-signed
          path: signed
          if-no-files-found: error
